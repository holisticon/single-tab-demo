<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Central Single Tab Application</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="hap-headline--lg">Central Single Tab Application</h1>
      <div class="workspace">
        <section class="app-panel" aria-labelledby="registration-heading">
          <div class="panel-heading">
            <h2 id="registration-heading" class="hap-headline--sm">
              Registration
            </h2>
            <span
              id="status"
              class="hap-badge hap-feedback--neutral"
              role="status"
              >Connecting</span
            >
          </div>
          <p
            id="handoff-notice"
            class="hap-alert hap-feedback--neutral"
            role="status"
          >
            Checking primary registration.
          </p>
          <section id="inbox" hidden aria-label="Received messages">
            <div class="value-label">
              <h2 class="hap-headline--sm">Received messages</h2>
              <span id="received-count" class="hap-badge hap-feedback--neutral"
                >0</span
              >
            </div>
            <p id="empty-inbox" class="hint">No messages received.</p>
            <div
              id="messages"
              role="log"
              aria-label="Received messages"
              aria-live="polite"
            ></div>
          </section>
          <span id="updated" class="connection-status" role="status"
            >Initializing</span
          >
          <a
            id="open-satellite"
            class="satellite-link hap-textlink--sm"
            href="http://localhost:3001/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Integrated Satellite System in a new window"
            >Open Integrated Satellite System</a
          >
          <p
            id="error"
            class="hap-alert hap-feedback--critical"
            role="alert"
            hidden
          ></p>
        </section>
        <section class="app-panel" aria-labelledby="tabs-heading">
          <div class="panel-heading">
            <h2 id="tabs-heading" class="hap-headline--sm">Connected tabs</h2>
            <span id="count" class="hap-badge hap-feedback--neutral">1</span>
          </div>
          <div id="tabs"></div>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
