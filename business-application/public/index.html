<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>business-application</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="business-application-shell">
      <h1 class="hap-headline--lg">business-application</h1>
      <form
        class="app-panel message-form"
        action="http://localhost:3000/"
        method="get"
        target="_blank"
        rel="noopener noreferrer"
      >
        <input type="hidden" name="key" value="main-tab-demo" />
        <div class="hap-textfield">
          <label for="message">Message</label>
          <input id="message" name="message" type="text" required />
        </div>
        <button class="hap-button hap-button--primary" type="submit">
          Open central-tasklist
        </button>
      </form>
    </main>
  </body>
</html>
