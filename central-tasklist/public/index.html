<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>central-tasklist</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="hap-headline--lg">central-tasklist</h1>
      <div class="workspace">
        <section class="app-panel" aria-labelledby="registration-heading">
          <div class="panel-heading">
            <h2 id="registration-heading" class="hap-headline--sm">
              Registration
            </h2>
            <span
              id="status"
              class="hap-badge hap-feedback--neutral"
              role="status"
              >Connecting</span
            >
          </div>
          <p
            id="handoff-notice"
            class="hap-alert hap-feedback--neutral"
            role="status"
          >
            Checking primary registration.
          </p>
          <section id="inbox" hidden aria-label="Opened URLs">
            <div class="value-label">
              <h2 class="hap-headline--sm">Opened URLs</h2>
              <span
                id="opened-url-count"
                class="hap-badge hap-feedback--neutral"
                >0</span
              >
            </div>
            <p id="empty-inbox" class="hint">No URLs opened.</p>
            <div
              id="opened-urls"
              role="log"
              aria-label="Opened URLs"
              aria-live="polite"
            ></div>
          </section>
          <span id="updated" class="connection-status" role="status"
            >Initializing</span
          >
          <a
            id="open-business-application"
            class="business-application-link hap-textlink--sm"
            href="http://localhost:3001/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open business-application in a new window"
            >Open business-application</a
          >
          <p
            id="error"
            class="hap-alert hap-feedback--critical"
            role="alert"
            hidden
          ></p>
        </section>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
